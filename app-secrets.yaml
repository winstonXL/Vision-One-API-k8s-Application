# ────────────────────────────────────────────────────────────────────────────
# app-secrets.yaml
#
# IMPORTANT: Never commit this file to source control.
#            Add it to .gitignore immediately.
#
# All values must be base64-encoded. Encode a value with:
#   echo -n 'your-value-here' | base64
#
# Replace every <BASE64_...> placeholder before applying.
# Apply with:
#   kubectl apply -f app-secrets.yaml
# ────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: v1-workbench-secrets
  namespace: default
type: Opaque
data:
  # Vision One Workbench Alerts API token
  TOKEN_ALERTS: <Vision One API Token for Workbench Retrieval>

  # Vision One Detection Model Management API token
  TOKEN_MODELS: <Vision One API Token for Detection Model Retrieval>

  # AWS credentials for Bedrock (Nova Lite)
  AWS_ACCESS_KEY_ID: <AWS Access Key ID>
  AWS_SECRET_ACCESS_KEY: <SECRET AWS Access Key>

  # AWS region where Bedrock is enabled (e.g. us-east-1)
  AWS_REGION: <Region in which to access Bedrock Resources>
